[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xmm-tools"
version = "0.1.0"
description = "Helper utilities for XMM-Newton X-ray data analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=5.0",
    "numpy>=1.24",
]

[project.scripts]
xmm-qdp = "xmm_tools.qdp.gui:main"
xmm-esas = "xmm_tools.esas.cli:main"

[project.optional-dependencies]
gui = [
    "imgui-bundle>=1.90",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
